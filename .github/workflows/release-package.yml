name: Release Package

on:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run regression checks
        run: bash tests/smoke.sh

      - name: Release security guard
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(
            git ls-files | grep -Ei '(^|/)(\.env($|\.)|wp-config\.php$|credentials[^/]*\.json$|secrets[^/]*\.json$|[^/]+\.(sql|sqlite|sqlite3|db|csv|log|pem|key|p12|pfx|bak|zip|tar|gz|tgz)$|backups?/|exports?/|captures?/)' || true
          )"
          if [ -n "$forbidden_files" ]; then
            echo "Forbidden release files found:"
            echo "$forbidden_files"
            exit 1
          fi

          if grep -RInE             --exclude-dir=.git             --exclude='release-package.yml'             '(Beacon[[:space:]]+Hospital|beaconhospital|60123286913|0123286913|GTM-[A-Z0-9]{5,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(live|test)_[A-Za-z0-9]{10,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|DB_PASSWORD[[:space:]]*=|client_secret[[:space:]]*[:=]|access_token[[:space:]]*[:=])' .; then
            echo "Potential client data or secret pattern found."
            exit 1
          fi

          if grep -RInE             --include='*.php'             --exclude-dir=.git             '\b(eval|exec|shell_exec|system|passthru|proc_open|popen)[[:space:]]*\(' .; then
            echo "High-risk PHP execution primitive found."
            exit 1
          fi

      - name: Build production ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/whatsapp-tracker

          cp whatsapp-tracker.php uninstall.php LICENSE README.md SECURITY.md CHANGELOG.md build/whatsapp-tracker/
          cp -R admin assets includes languages build/whatsapp-tracker/

          find build/whatsapp-tracker -type f -name '.DS_Store' -delete
          find build/whatsapp-tracker -type f -name '*.map' -delete

          # Normalize mtimes and archive ordering so identical source produces
          # the same release checksum across repeated builds.
          find build/whatsapp-tracker -exec touch -t 198001010000.00 {} +
          cd build
          find whatsapp-tracker -print | LC_ALL=C sort | zip -X -q whatsapp-tracker.zip -@
          sha256sum whatsapp-tracker.zip > whatsapp-tracker.zip.sha256

      - name: Verify production archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -l build/whatsapp-tracker.zip

          if unzip -Z1 build/whatsapp-tracker.zip | grep -Ei '(^|/)(tests|\.github|\.git|node_modules|vendor|backups?|exports?|captures?)/|(^|/)\.env|wp-config\.php|\.(sql|sqlite|sqlite3|db|csv|log|pem|key|p12|pfx|bak)$'; then
            echo "Development or sensitive file leaked into production ZIP."
            exit 1
          fi

          test "$(unzip -p build/whatsapp-tracker.zip whatsapp-tracker/whatsapp-tracker.php | grep -c 'Version: 1.0.0')" -eq 1
          test "$(unzip -p build/whatsapp-tracker.zip whatsapp-tracker/whatsapp-tracker.php | grep -c 'Author: Khairul Azhar')" -eq 1

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-tracker-v1.0.0
          path: |
            build/whatsapp-tracker.zip
            build/whatsapp-tracker.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1.0.0 release if missing
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; leaving published release unchanged."
            exit 0
          fi

          cat > build/release-notes.md <<'EOF'
          ## WhatsApp Tracker v1.0.0

          First generic public release of WhatsApp Tracker for WordPress.

          ### Highlights
          - Aggregate WhatsApp click analytics and source attribution
          - Central WhatsApp routes with primary/backup numbers
          - Dynamic language messages with Polylang support
          - Link inventory scanning and safe bulk migration/rollback
          - WhatsApp and telephone service notices
          - Provider-neutral live chat action with optional Tawk.to support
          - Portable configuration export/import
          - Delegated WordPress role access via `manage_whatsapp_tracker`
          - Optional lightweight Recent Changes scans
          - Dashboard health checks and audit history
          - GitHub-based plugin updates using the official release ZIP

          ### Security / packaging
          - Production package excludes tests, CI files, backups, exports and development artifacts
          - No client-specific Beacon Hospital data, credentials, API keys or GTM container IDs
          - Official updater accepts only this repository's `whatsapp-tracker.zip` release asset
          - PHP 7.4+ required
          - Serialized migration backups are restored with object instantiation disabled

          **Author:** Khairul Azhar  
          **Plugin page:** https://khairulazhar.com/my-plugins-and-tools/

          WhatsApp Tracker is an independent project and is not affiliated with WhatsApp or Meta.
          EOF

          gh release create v1.0.0 \
            build/whatsapp-tracker.zip \
            build/whatsapp-tracker.zip.sha256 \
            --target "${GITHUB_SHA}" \
            --title "WhatsApp Tracker v1.0.0" \
            --notes-file build/release-notes.md \
            --latest
